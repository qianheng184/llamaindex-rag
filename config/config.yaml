# RAG 系统配置文件 - v2.0

system:
  name: "RAG System"
  version: "2.0"
  log_level: "INFO"

indexing:
  data_dir: "./data"
  chunk_size: 500
  chunk_overlap: 50
  batch_size: 32

retrieval:
  top_k: 5
  rerank_top_k: 10
  use_hybrid_search: true

embedding:
  model: "BAAI/bge-small-zh-v1.5"
  dimension: 512

inference:
  provider: "deepseek"
  providers:
    deepseek:
      api_key: "${DEEPSEEK_API_KEY}"
      model: "deepseek-chat"
      base_url: "https://api.deepseek.com/v1"
    ollama:
      base_url: "http://localhost:11434"
      model: "qwen2.5:1.5b"

database:
  type: "chromadb"
  path: "./database/chroma_db"

cache:
  enabled: true
  type: "memory"
  ttl: 3600

api:
  host: "0.0.0.0"
  port: 8000
  enable_stream: true
